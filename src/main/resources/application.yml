spring:
  application:
    name: SpringBootDemo
  profiles:
    active: dev

# SSO配置 - 统一管理CAS和OIDC认证
sso:
  # Keycloak OIDC配置
  keycloak:
    enabled: true
    client-id: springboot
    client-secret: rhP74DrlG3IZpW6GmoFNEyUmlAcnD0y3
    realm: selfTest
    base-url: http://localhost:8080
    redirect-uri: http://localhost:8888/api/auth/sso/keycloak/callback
    default-role: USER
  # CAS 2.0配置
  cas:
    enabled: true
    server-url-prefix: https://localhost:8444/cas
    client-host-url: http://localhost:8888
    login-path: /login/cas
    default-role: USER

